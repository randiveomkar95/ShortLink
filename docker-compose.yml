services:
  postgres:
    image: postgres:16
    container_name: shortlink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortlink
      POSTGRES_USER: shortlink_user
      POSTGRES_PASSWORD: local_dev_password_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink_user -d shortlink"]
      interval: 5s
      timeout: 3s
      retries: 10
      
volumes:
  postgres_data: